<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 760 290" width="760" height="290" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#0a7ea4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="760" height="310" fill="#f4f8fb"/>

  <!-- Connect -->
  <rect x="20" y="40" width="200" height="240" rx="14" fill="#ffffff" stroke="#d8e3ec" stroke-width="1.5"/>
  <text x="120" y="66" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.2" fill="#0a7ea4">CONNECT</text>
  <rect x="40" y="84" width="160" height="46" rx="8" fill="#e0f2f9" stroke="#0a7ea4" stroke-width="1.2"/>
  <text x="120" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#0f1c2a">Authentication</text>
  <rect x="40" y="153" width="160" height="46" rx="8" fill="#e0f2f9" stroke="#0a7ea4" stroke-width="1.2"/>
  <text x="120" y="181" text-anchor="middle" font-size="15" font-weight="600" fill="#0f1c2a">Lobby</text>
  <rect x="40" y="222" width="160" height="46" rx="8" fill="#e0f2f9" stroke="#0a7ea4" stroke-width="1.2"/>
  <text x="120" y="250" text-anchor="middle" font-size="15" font-weight="600" fill="#0f1c2a">Relay</text>
  <line x1="120" y1="130" x2="120" y2="151" stroke="#0a7ea4" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="120" y1="199" x2="120" y2="220" stroke="#0a7ea4" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Session -->
  <rect x="290" y="40" width="200" height="240" rx="14" fill="#ffffff" stroke="#d8e3ec" stroke-width="1.5"/>
  <text x="390" y="66" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.2" fill="#0a7ea4">SESSION</text>
  <rect x="308" y="130" width="164" height="76" rx="8" fill="#e0f2f9" stroke="#0a7ea4" stroke-width="1.2"/>
  <text x="390" y="162" text-anchor="middle" font-size="15" font-weight="600" fill="#0f1c2a">ConnectionManager</text>
  <text x="390" y="186" text-anchor="middle" font-size="12" fill="#5a6b7b">players · colours · names</text>

  <!-- Match -->
  <rect x="560" y="40" width="180" height="240" rx="14" fill="#ffffff" stroke="#d8e3ec" stroke-width="1.5"/>
  <text x="650" y="66" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.2" fill="#0a7ea4">MATCH</text>
  <rect x="576" y="130" width="148" height="76" rx="8" fill="#e0f2f9" stroke="#0a7ea4" stroke-width="1.2"/>
  <text x="650" y="162" text-anchor="middle" font-size="15" font-weight="600" fill="#0f1c2a">Networked</text>
  <text x="650" y="183" text-anchor="middle" font-size="15" font-weight="600" fill="#0f1c2a">state machine</text>

  <!-- Group arrows -->
  <line x1="222" y1="168" x2="288" y2="168" stroke="#0a7ea4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="492" y1="168" x2="558" y2="168" stroke="#0a7ea4" stroke-width="2" marker-end="url(#arrow)"/>

</svg>
